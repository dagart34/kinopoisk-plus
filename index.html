<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Player</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .kinobox_player {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- Контейнер для чистого плеера -->
    <div class="kinobox_player"></div>

    <!-- Подключаем официальный скрипт Kinobox -->
    <script src="https://kinobox.net/kinobox.min.js"></script>
    <script>
        // Получаем Kinopoisk ID из URL (например: ?id=61237)
        const urlParams = new URLSearchParams(window.location.search);
        const filmId = urlParams.get('id') || '61237'; // 61237 — по умолчанию Железный человек

        // Инициализируем плеер
        new Kinobox('.kinobox_player', {
            search: { kinopoisk: filmId },
            menu: {
                enable: true,
                default: 'Collaps',
                mobile: true
            }
        }).init();
    </script>

</body>
</html>
