<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Player</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .kinobox_player {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="kinobox_player"></div>

    <script src="https://kinobox.net/kinobox.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        // Берём ID из параметров ?id= или по умолчанию ставь Железного Человека (Kinopoisk ID 61237)
        const filmId = urlParams.get('id') || '61237';

        if (typeof Kinobox !== 'undefined') {
            new Kinobox('.kinobox_player', {
                search: { kinopoisk: filmId },
                players: ['Collaps', 'Alloha', 'Videocdn', 'HDRezka'],
                menu: { enable: true }
            }).init();
        } else {
            // Если внешний скрипт заблокирован, открываем плеер напрямую в iframe
            document.querySelector('.kinobox_player').innerHTML = 
                `<iframe src="https://api.collaps.org/embed/movie/${filmId}" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>`;
        }
    </script>
</body>
</html>
