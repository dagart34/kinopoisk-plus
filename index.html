<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн плеер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #0d0d0d; display: flex; justify-content: center; align-items: center; }
        .player-wrapper { width: 100%; max-width: 1200px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
        .kinobox_player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <div class="kinobox_player"></div>
    </div>

    <script src="https://kinobox.tv/kinobox.min.js"></script>
    <script>
        function getKinopoiskId() {
            const path = window.location.pathname;
            const match = path.match(/(?:film|series)\/(\d+)/i);
            if (match && match[1]) return match[1];
            
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || '263531';
        }

        // Корректный запуск Kinobox
        new Kinobox('.kinobox_player', {
            search: { kinopoisk: getKinopoiskId() }
        }).init();
    </script>
</body>
</html>
