<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка плеера...</title>
    <!-- Добавлен слэш / перед styles.css -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <div class="player-wrapper">
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <span>Загрузка плеера...</span>
        </div>

        <div id="empty-state" class="empty-state">
            <!-- Добавлен слэш / перед Dash.png -->
            <img class="dash-icon" src="/Dash.png" alt="">
            <h1>Фильм не выбран</h1>
            <p>Чтобы начать просмотр, откройте нужный фильм на Кинопоиске и нажмите кнопку <span class="btn-badge">▶&nbsp;&nbsp;Смотреть в Кинопоиск+</span></p>
        </div>

        <iframe id="player" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>

    <footer class="site-footer">by dag_art_34</footer>

    <script>
        const CONFIG = {
            TOKEN: '45e20a5f584becf7a64dffb7174ddf',
            API_URL: 'https://api.apbugall.org/',
            PLAYER_URL: 'https://player.alloha.host/'
        };

        function getKinopoiskId() {
            const match = window.location.pathname.match(/\/(?:film|series)\/(\d+)/i);
            if (match && match[1]) return match[1];
            
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        async function initPlayer() {
            const kpId = getKinopoiskId();
            const iframe = document.getElementById('player');
            const loader = document.getElementById('loader');
            const emptyState = document.getElementById('empty-state');

            if (!kpId) {
                document.title = 'Кинопоиск+ — Выберите фильм';
                loader.style.display = 'none';
                iframe.style.display = 'none';
                emptyState.style.display = 'flex';
                return;
            }

            const fallbackUrl = `${CONFIG.PLAYER_URL}?token=${CONFIG.TOKEN}&kp=${kpId}`;

            iframe.addEventListener('load', () => {
                iframe.classList.add('loaded');
                loader.style.display = 'none';
            });

            try {
                const response = await fetch(`${CONFIG.API_URL}?token=${CONFIG.TOKEN}&kp=${kpId}`);
                if (!response.ok) throw new Error(`HTTP status ${response.status}`);

                const res = await response.json();

                if (res?.data) {
                    if (res.data.name) {
                        const year = res.data.year ? ` (${res.data.year})` : '';
                        document.title = `${res.data.name}${year} — Смотреть онлайн`;
                    }
                    iframe.src = res.data.iframe || fallbackUrl;
                } else {
                    iframe.src = fallbackUrl;
                }
            } catch (err) {
                console.warn('Ошибка получения метаданных, запуск стандартного плеера:', err);
                iframe.src = fallbackUrl;
            }
        }

        document.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
