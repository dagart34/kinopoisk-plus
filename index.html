<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн плеер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #0d0d0d; display: flex; justify-content: center; align-items: center; }
        .player-wrapper { width: 100%; max-width: 1200px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="player-wrapper" id="player-container"></div>

    <script>
        function getKinopoiskId() {
            const path = window.location.pathname;
            const match = path.match(/(?:film|series)\/(\d+)/i);
            if (match && match[1]) return match[1];
            
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || '263531';
        }

        const kpId = getKinopoiskId();
        const container = document.getElementById('player-container');

        // Вставка плеера через iframe
        container.innerHTML = `<iframe src="https://kinobox.tv/embed/film/${kpId}" allowfullscreen width="100%" height="100%"></iframe>`;
    </script>
</body>
</html>
