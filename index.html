<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр фильма</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0e;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .header {
            height: 48px;
            background: #141419;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            border-bottom: 1px solid #222;
        }
        select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }
        #player-frame {
            flex: 1;
            width: 100%;
            height: calc(100vh - 48px);
            border: none;
        }
        .error {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #ff6600;
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <span style="font-size: 14px; color: #aaa;">Источник:</span>
        <select id="sourceSelect" onchange="changeSource()">
            <option value="kinobox">Плеер 1 (Kinobox)</option>
            <option value="alloha">Плеер 2 (Alloha)</option>
            <option value="vidsrc">Плеер 3 (Резерв)</option>
        </select>
    </div>

    <iframe id="player-frame" allowfullscreen allow="autoplay; fullscreen"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const kpId = urlParams.get('id') || urlParams.get('kp');
        const iframe = document.getElementById('player-frame');

        if (!kpId) {
            document.body.innerHTML = '<div class="error">Ошибка: ID фильма не передан в URL (?id=263531)</div>';
        } else {
            const sources = {
                kinobox: `https://kinobox.net/embed/kp/${kpId}`,
                alloha: `https://api.alloha.tv/?kp=${kpId}`,
                vidsrc: `https://vidsrc.me/embed/movie?kinopoisk=${kpId}`
            };

            function changeSource() {
                const selected = document.getElementById('sourceSelect').value;
                iframe.src = sources[selected];
            }

            changeSource();
        }
    </script>
</body>
</html>
