<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр фильма</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .kinobox_player {
            width: 100%;
            height: 100%;
        }
        .error-msg {
            color: #fff;
            text-align: center;
            margin-top: 20%;
        }
    </style>
</head>
<body>

    <div class="kinobox_player"></div>

    <!-- Подключаем скрипт Kinobox -->
    <script src="https://kinobox.tv/kinobox.min.js"></script>
    <script>
        // Извлекаем ID из URL (например: site.com/?id=263531)
        const urlParams = new URLSearchParams(window.location.search);
        const kpId = urlParams.get('id');

        if (kpId) {
            // Инициализируем плеер
            new Kinobox('.kinobox_player', {
                search: { kinopoisk: kpId },
                menu: {
                    default: 'menuList', // Меню выбора плееров и озвучек
                    mobile: 'menuList'
                }
            }).init();
        } else {
            document.body.innerHTML = '<h2 class="error-msg">Ошибка: Не указан ID фильма</h2>';
        }
    </script>
</body>
</html>
