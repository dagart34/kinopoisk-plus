<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            background: #0d0d0d; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: sans-serif;
            color: #fff;
        }

        .player-wrapper { 
            width: 100%; 
            max-width: 1200px; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <div id="loader" class="loader">Загрузка видео...</div>
        <iframe id="player" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>

    <script>
        function getKinopoiskId() {
            const match = window.location.pathname.match(/(?:film|series)\/(\d+)/i);
            if (match && match[1]) return match[1];
            
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || '263531';
        }

        const kpId = getKinopoiskId();
        const token = '45e20a5f584becf7a64dffb7174ddf';
        const iframe = document.getElementById('player');
        const loader = document.getElementById('loader');

        // Запрос к найденному API Alloha
        fetch(`https://api.apbugall.org/?token=${token}&kp=${kpId}`)
            .then(response => response.json())
            .then(res => {
                if (res && res.data) {
                    // 1. Устанавливаем заголовок вкладки: Название (Год)
                    if (res.data.name && res.data.year) {
                        document.title = `${res.data.name} (${res.data.year})`;
                    }

                    // 2. Вставляем iframe из ответа API (или запасной URL плеера)
                    iframe.src = res.data.iframe || `https://player.alloha.host/?token=${token}&kp=${kpId}`;
                } else {
                    iframe.src = `https://player.alloha.host/?token=${token}&kp=${kpId}`;
                }
                loader.style.display = 'none';
            })
            .catch(err => {
                console.error('Ошибка получения метаданных:', err);
                // Запасной запуск при ошибке API
                iframe.src = `https://player.alloha.host/?token=${token}&kp=${kpId}`;
                loader.style.display = 'none';
            });
    </script>
</body>
</html>
