<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плеер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            background: #0d0d0d; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .content { 
            width: 100%; 
            max-width: 1200px; 
            aspect-ratio: 16 / 9; 
        }

        .kinobox { 
            width: 100%; 
            height: 100%; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
        }

        .kinobox iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <div class="content">
        <div class="kinobox">
            <iframe id="player-frame" allowfullscreen allow="autoplay; fullscreen"></iframe>
        </div>
    </div>

    <script>
        // Получение ID из URL (/film/263531 или ?id=263531)
        function getKinopoiskId() {
            const match = window.location.pathname.match(/(?:film|series)\/(\d+)/i);
            if (match && match[1]) return match[1];
            
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || '263531';
        }

        // Подстановка ID в донорский плеер fbphdplay.top
        const kpId = getKinopoiskId();
        document.getElementById('player-frame').src = `https://fbphdplay.top/film/${kpId}`;
    </script>
</body>
</html>
